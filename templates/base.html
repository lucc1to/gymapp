<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}GymApp{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
</head>
<body>
  <main class="container">
    <nav>
      <ul><li><strong>GymApp</strong></li></ul>
      <ul>
  {% if user.is_authenticated %}
    <li><a href="{% url 'workout_list' %}">Treningi</a></li>
    <li>
      <form method="post" action="{% url 'logout' %}" style="margin:0">
        {% csrf_token %}
        <button type="submit" class="outline secondary">Wyloguj</button>
      </form>
    </li>
  {% else %}
    <li><a href="{% url 'login' %}">Zaloguj</a></li>
  {% endif %}
</ul>
    </nav>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
