{% extends "base.html" %}

{% block content %}
<h1>Moje treningi</h1>

<a href="{% url 'workout_create' %}" role="button">+ Nowy trening</a>

{% for workout in workouts %}
  <article>
    <h3><a href="{% url 'workout_detail' workout.pk %}">{{ workout.name }}</a></h3>
    <p>{{ workout.items.count }} ćwiczeń · {{ workout.total_volume }} kg</p>
    <form method="post" action="{% url 'session_start' workout.pk %}">
        {% csrf_token %}
        <button type="submit">▶ START</button>
    </form>
  </article>
{% empty %}
  <p>Nie masz jeszcze treningów.</p>
{% endfor %}
{% endblock %}
